<html>
  <script>
    window.__musicKitScriptFailed = false;
  </script>
  <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" onerror="window.__musicKitScriptFailed = true;"></script>
  <body>
    <h2>Apple Music Authorization</h2>
     <div id="debugInfo" style="margin-bottom: 20px; padding: 10px; background-color: #f0f0f0; border-radius: 5px;">
      <p><strong>Device Code:</strong> <span id="deviceCodeDisplay">Loading...</span></p>
      <p><strong>Developer Token:</strong> <span id="developerTokenDisplay">Loading...</span></p>
    </div>
    <pre id="output"></pre>
    <button id="signInBtn" style="display:none;">Sign in with Apple Music</button>
    <button id="retryLinkBtn" style="display:none;">Retry</button>
    <p style="margin-top:24px; font-size:13px; color:#888;">Debug log (for troubleshooting):</p>
    <pre id="debugLog" style="font-size:12px; color:#444; background:#f7f7f7; padding:8px; border-radius:4px; max-height:240px; overflow:auto; white-space:pre-wrap; word-break:break-all;"></pre>
    <script>
      const debugLogEl = document.getElementById('debugLog');
      function logStep(msg) {
        const t = new Date();
        const time = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
        const line = '[' + time + '] ' + msg;
        console.log(line);
        if (debugLogEl) {
          debugLogEl.textContent += line + '\n';
          debugLogEl.scrollTop = debugLogEl.scrollHeight;
        }
      }

      // Surface anything that would otherwise only show up in devtools.
      window.addEventListener('error', function (e) {
        logStep('window error: ' + (e.message || e));
      });
      window.addEventListener('unhandledrejection', function (e) {
        const reason = e.reason && e.reason.message ? e.reason.message : e.reason;
        logStep('unhandled promise rejection: ' + reason);
      });

      // Helper to get device_code from the URL
      function getQueryParam(param) {
        const url = new URL(window.location.href);
        return url.searchParams.get(param);
      }
      const deviceCode = getQueryParam('device_code');
      const developerToken = getQueryParam('developer_token');
      logStep('Page loaded. device_code=' + deviceCode + ', developer_token present=' + !!developerToken);

  // Display the values on the page
      document.getElementById('deviceCodeDisplay').textContent = deviceCode || 'Not provided';
      document.getElementById('developerTokenDisplay').textContent = developerToken ? developerToken : 'Not provided';

      const outputEl = document.getElementById('output');
      const signInBtn = document.getElementById('signInBtn');
      const retryLinkBtn = document.getElementById('retryLinkBtn');
      let musicKitBooted = false;

      // If the MusicKit script never loads or never fires 'musickitloaded',
      // tell the user instead of leaving the page stuck on "Loading...".
      setTimeout(function () {
        if (musicKitBooted) return;
        if (window.__musicKitScriptFailed) {
          logStep('MusicKit script failed to load (network or blocked request).');
          outputEl.textContent = 'Failed to load the Apple Music sign-in script. Check your connection and reload this page.';
        } else if (!window.MusicKit) {
          logStep('MusicKit script loaded but window.MusicKit is still undefined after 15s.');
          outputEl.textContent = 'Apple Music sign-in did not initialize. Please reload this page.';
        } else {
          logStep('window.MusicKit exists but "musickitloaded" never fired after 15s.');
          outputEl.textContent = 'Apple Music sign-in did not finish initializing. Please reload this page.';
        }
      }, 15000);

      // POSTs deviceCode/userToken to the backend, retrying on failure to
      // absorb a slow first request or a transient network/server hiccup.
      function linkTokenToBackend(userToken, attempt) {
        attempt = attempt || 1;
        const maxAttempts = 3;
        const backoffMs = [2000, 4000];

        if (attempt === 1) {
          outputEl.textContent = 'Signing you in...';
        } else {
          outputEl.textContent = 'Still trying to reach the server (attempt ' + attempt + ' of ' + maxAttempts + ')...';
        }
        retryLinkBtn.style.display = 'none';

        fetch('https://signinwithapplebackendserver.onrender.com/link-apple-token', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            device_code: deviceCode,
            user_token: userToken
          })
        })
        .then(function(response) {
          if (response.ok) {
            logStep('link-apple-token succeeded (attempt ' + attempt + ')');
            outputEl.textContent = 'Apple Music login successful!\nYou can close this page and check your car display.';
            return;
          }
          throw new Error('Backend responded with status ' + response.status);
        })
        .catch(function(err) {
          logStep('link-apple-token attempt ' + attempt + ' failed: ' + err.message);
          if (attempt < maxAttempts) {
            setTimeout(function() {
              linkTokenToBackend(userToken, attempt + 1);
            }, backoffMs[attempt - 1]);
          } else {
            outputEl.textContent = 'Signed in, but could not notify your device: ' + err.message;
            retryLinkBtn.style.display = 'block';
            retryLinkBtn.onclick = function() {
              linkTokenToBackend(userToken, 1);
            };
          }
        });
      }

      document.addEventListener('musickitloaded', function () {
        musicKitBooted = true;
        logStep('musickitloaded event fired');

        // MusicKit v3's configure() is asynchronous - it returns a Promise
        // that resolves with the instance, unlike v1 where configure() was
        // synchronous and a separate MusicKit.getInstance() call worked
        // immediately afterward. Calling getInstance() before this Promise
        // resolves returns undefined, which is why authorize() was throwing
        // "cannot read properties of undefined".
        MusicKit.configure({
          developerToken: developerToken,
          app: {
            name: 'com.pasa.mediaplayer',
            build: '1',
          },
        }).then(function (music) {
          logStep('MusicKit.configure() succeeded');

          // Only start the Apple sign-in flow from a real tap - authorize()
          // is more reliable across mobile browsers when it originates from a
          // direct user gesture rather than firing automatically on page load.
          signInBtn.style.display = 'block';
          signInBtn.onclick = function () {
            signInBtn.style.display = 'none';
            outputEl.textContent = 'Opening Apple sign-in...';
            logStep('Sign-in button tapped, calling authorize()');

            let authorizeSettled = false;
            const authorizeWatchdog = setTimeout(function () {
              if (authorizeSettled) return;
              logStep('authorize() has not responded after 20s - likely a blocked pop-up or blocked cookies/storage.');
              outputEl.textContent = 'Sign-in did not respond. This is often caused by a blocked pop-up or blocked cookies. ' +
                'Check your browser for a blocked pop-up notification and allow it, or check that cookies are allowed, then tap Sign in again.';
              signInBtn.style.display = 'block';
            }, 20000);

            let authorizePromise;
            try {
              authorizePromise = music.authorize();
            } catch (e) {
              authorizeSettled = true;
              clearTimeout(authorizeWatchdog);
              logStep('authorize() threw synchronously: ' + e.message);
              outputEl.textContent = 'Sign-in failed to start: ' + e.message;
              signInBtn.style.display = 'block';
              return;
            }

            authorizePromise.then(function (userToken) {
              authorizeSettled = true;
              clearTimeout(authorizeWatchdog);
              logStep('authorize() resolved successfully');

              if (deviceCode) {
                linkTokenToBackend(userToken, 1);
              } else {
                outputEl.textContent = 'Successfully signed in!\nToken: ' + userToken;
              }
            }).catch(function (err) {
              authorizeSettled = true;
              clearTimeout(authorizeWatchdog);
              const errMsg = err && err.message ? err.message : err;
              logStep('authorize() rejected: ' + errMsg);
              outputEl.textContent = 'Authorization failed: ' + errMsg;
              signInBtn.style.display = 'block';
            });
          };
        }).catch(function (e) {
          logStep('MusicKit.configure() rejected: ' + (e && e.message ? e.message : e));
          outputEl.textContent = 'Failed to configure Apple Music sign-in: ' + (e && e.message ? e.message : e);
        });
      });

      // Fallback: check if MusicKit is already loaded
      if (window.MusicKit) {
        logStep('window.MusicKit already available on script load');
        document.dispatchEvent(new Event('musickitloaded'));
      }
    </script>
  </body>
</html>
